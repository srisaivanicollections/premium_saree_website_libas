name: Smart Finder Release Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/smart-finder-all-categories]

jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check checkout.js
          node --check saree-finder.js
          node --check saree-occasion-ai.js
          node --test tests/saree-occasion-ai.test.mjs
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";
          const html = readFileSync("index.html", "utf8");
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)];
          let checked = 0;
          for (const [, attrs, source] of scripts) {
            if (/\bsrc\s*=/i.test(attrs)) continue;
            const type = attrs.match(/\btype\s*=\s*["']([^"']+)["']/i)?.[1]?.toLowerCase();
            if (type && !["text/javascript", "application/javascript", "module"].includes(type)) continue;
            if (!source.trim()) continue;
            try { new Function(source); }
            catch (error) { throw new Error("Inline JavaScript syntax error in index.html script " + (checked + 1) + ": " + error.message); }
            checked++;
          }
          assert.ok(checked > 0, "Expected executable inline JavaScript in index.html");
          console.log("Parsed " + checked + " inline JavaScript blocks from index.html.");
          NODE
      - name: Validate Smart Finder release contract
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";

          const app = readFileSync("app.js", "utf8");
          const finder = readFileSync("saree-finder.js", "utf8");
          const aiScanner = readFileSync("saree-occasion-ai.js", "utf8");
          const catalogue = JSON.parse(readFileSync("data/products.json", "utf8"));
          const page = readFileSync("index.html", "utf8");
          const checkout = readFileSync("checkout.js", "utf8");

          assert.match(page, /function validateProductInput\(product\)\{[\s\S]*?\["Sarees","Dresses","Jewellery"\]/, "Live Admin validation must allow Jewellery");
          assert.match(page, /id="fCat"[\s\S]{0,700}value="Jewellery"/, "Live Admin editor must render a Jewellery option");
          assert.match(page, /const fields=\["name","category","image","color","price"/, "Live Admin persistence verification must cover category and price");
          assert.match(page, /const enabled=\["Sarees","Dresses","Jewellery"\]/, "Live storefront must expose enabled Sarees, Dresses, and Jewellery categories");
          assert.match(aiScanner, /onnx-community\/CLIP-ViT-B-32-laion2B-s34B-b79K-ONNX/, "AI scanner must use the selected MIT-licensed model");
          assert.match(aiScanner, /zero-shot-image-classification/, "AI scanner must use browser-side zero-shot image classification");
          assert.match(aiScanner, /selectColourPrediction/, "AI scanner must detect product colour");
          assert.match(aiScanner, /device:\s*"wasm"/, "AI scanner must run in the browser rather than a hosted inference service");
          assert.doesNotMatch(finder, /import\("\.\/saree-occasion-ai\.js"\)|AI_OCCASION_SCAN_LIMIT|addAiOccasionMatches/, "Customer Finder must not download or run the AI model");
          assert.match(page, /function ssvEnrichFinderCatalogue\(/, "Admin Studio must provide persisted Finder enrichment");
          assert.match(page, /id="adminEnrichFinderLink" class="admin-enrich-finder-link"/, "Admin Products must expose the Enrich Finder text link");
          assert.match(page, /id="adminEnrichFinderPopup"/, "Admin must provide the Enrich Finder popup");
          assert.match(page, /id="adminEnrichFinderClose" aria-label="Close Enrich Finder"/, "Enrich Finder popup must provide a close control");
          assert.doesNotMatch(page, /data-view="enrich">ENRICH FINDER/, "Enrich Finder must not occupy a separate Admin tab");
          assert.match(page, /occasionMissingCount=queue\\.filter[\\s\\S]*?colourMissingCount=queue\\.filter/, "Enrich Finder must count missing occasion and colour fields separately");
          assert.match(page, /#admin \.admin-products-heading-actions\s*\{[\s\S]*?display:flex!important;[\s\S]*?flex-wrap:wrap!important;/, "Admin catalogue actions must have a wrapping flex layout");
          assert.match(page, /#admin \.admin-products-heading-actions>#adminEnrichFinderLink/, "Enrich Finder text link must have a scoped style override");
          assert.match(page, /@media\(max-width:600px\)[\s\S]*?#admin \.admin-products-heading-actions\s*\{[\s\S]*?width:100%!important;[\s\S]*?justify-content:space-between!important;/, "Enrich Finder link and Add Product must remain visible in the mobile action row");
          assert.match(page, /occasionMetadata=\{source:"ai"/, "AI occasion results must record their provenance");
          assert.match(page, /colourMetadata=\{source:"ai"/, "AI colour results must record their provenance");
          assert.match(page, /attempt<3&&!saved/, "Occasion metadata writes must retry GitHub SHA conflicts");
          assert.match(page, /ssvHasNoOccasionMetadata\(current\)/, "Enrichment must preserve existing occasion metadata");
          assert.match(page, /ssvHasNoColour\(current\)/, "Enrichment must preserve existing product colours");
          assert.doesNotMatch(page.slice(page.indexOf("async function saveProduct(id)"), page.indexOf('$("#menu").onclick')), /ssvEnrichFinderCatalogue\(/, "CRUD must not start model loading or inference");
          assert.match(finder, /id="ssv-finder-color-field"/, "Colour preference must have a hideable wrapper");
          assert.match(finder, /function syncColorField\(\)/, "Category changes must synchronize the colour field");
          assert.match(finder, /field\.hidden=jewellery/, "Jewellery must hide the colour field");
          assert.match(finder, /if\(jewellery&&select\)select\.value=""/, "Jewellery must clear stale colour selections");
          assert.match(finder, /allMatches\.filter\(p=>Number\(p\.price\)<=budget\)/, "Budget must be a strict maximum");
          assert.match(finder, /shownCount=Math\.min\(3,allMatches\.length\)/, "Finder must show no more than three matches per page");
          assert.match(finder, /Show More Matches/, "Finder must allow customers to reveal more matches in batches");
          assert.match(finder, /Recommended for You/, "Finder must label its recommendations");
          assert.doesNotMatch(finder, /ssv-finder-match-label|Best Match/, "Finder must avoid a redundant Best Match label");
          assert.match(finder, /Change Preferences/, "Finder must allow customers to refine preferences");
          assert.match(finder, /function helpUrl\(product\)/, "Finder must provide optional WhatsApp assistance using store settings");
          assert.match(finder, /wa\.me\//, "Finder must create WhatsApp help links");
          assert.match(finder, /View Product/, "Finder must provide a route to the matching catalogue product");
          assert.match(finder, /Add to Bag/, "Finder must offer an explicit add-to-bag action");
          assert.match(finder, /data-recovery="all"/, "No-match state must offer a browse-all recovery action");
          assert.match(finder, /storefront\.showAllProducts\(\)/, "Browse All must call the live storefront API");
          assert.match(page, /window\.SSVStorefront=Object\.freeze\(\{showAllProducts\(\)\{category="All"/, "Live storefront must expose a real Browse All operation");
          assert.match(finder, /rawPrice===null\|\|rawPrice===undefined\|\|String\(rawPrice\)\.trim\(\)===""[\s\S]*?price<=0/, "Finder must reject missing, empty, and non-positive prices");
          assert.match(finder, /textContent="New Arrivals"/, "Finder must offer a New Arrivals shortcut");
          assert.match(finder, /textContent="Best Sellers"/, "Finder must offer a Best Sellers shortcut");
          assert.match(finder, /function isCategoryEnabled\(category\)/, "Finder must respect storefront category visibility settings");
          assert.match(finder, /filter\(p=>isCategoryEnabled\(p.category\)\)/, "Disabled storefront categories must not be recommended");
          assert.match(finder, /const seenIds=new Set\(\)/, "Finder must reject duplicate and malformed product records");
          assert.match(finder, /!Number\.isSafeInteger\(id\)[\s\S]*?seenIds\.has\(id\)[\s\S]*?!name\|\|!image/, "Finder must validate stable ID, name, image, and duplicate IDs");
          assert.match(finder, /function isAvailable\(p\)\{return p\.availability!==false&&p\.inStock!==false&&p\.outOfStock!==true;\}/, "Finder availability must match the existing cart eligibility rule");
          assert.match(finder, /card.dataset.productId=String\(product.id/, "Finder results must retain stable product IDs");
          assert.match(finder, /window\.SSVCart/, "Finder must use the shared cart API, not a DOM timing race");
          assert.match(finder, /cartApi.addProduct\(product.id\)/, "Add to Bag must call the cart API with the stable product ID");
          assert.match(page, /class="lux-item-card" data-product-id=/, "Live storefront product cards must expose stable product IDs in the render template");
          assert.match(checkout, /function addProductToCart\(id\)/, "Cart must expose one validated add operation");
          assert.match(checkout, /if\(!saveCart\(nextCart\)\)return \{ok:false,reason:"storage"\}/, "Cart must not report success when persistence fails");
          assert.match(checkout, /window\.SSVCart=Object\.freeze\(\{addProduct:addProductToCart\}\)/, "Finder and storefront must share the same cart operation");
          assert.match(checkout, /const card=media\.closest\("\[data-product-id\]"\)/, "Cart controls must resolve products by stable ID");
          assert.match(finder, /!\["jewellery","jewelry"\]\.includes\(category\.trim\(\)\.toLowerCase\(\)\)/, "Jewellery must not be colour-filtered");
          assert.ok(catalogue.some(p => p.category === "Jewellery"), "Catalogue must contain Jewellery");
          assert.ok(catalogue.every(p => ["Sarees","Dresses","Jewellery"].includes(p.category)), "Catalogue categories must be canonical");
          console.log("Smart Finder release contract checks passed.");
          NODE

  browser-regression:
    needs: syntax-and-contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium browser tooling
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1 playwright@1.56.1
          node -e "if (require('playwright/package.json').version !== '1.56.1') throw new Error('Playwright runtime version mismatch')"
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Start local storefront
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ssv-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ssv-http.log
          exit 1
      - name: Run desktop and mobile customer journeys with safe external-service mocks
        run: |
          cat > .smart-finder-browser-regression.mjs <<'NODE'
          import { chromium } from "playwright";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const productsFixture = JSON.parse(readFileSync("data/products.json", "utf8"));
          const settingsFixture = JSON.parse(readFileSync("data/settings.json", "utf8"));
          const workerPattern = /^https:\/\/ssv-admin-otp\.vinith-paithari\.workers\.dev\/?/;
          const githubPattern = /^https:\/\/api\.github\.com\/repos\/srisaivanicollections\/srisaivanicollections\.github\.io\/contents\/data\/(products|settings)\.json/;

          async function installMocks(page) {
            const state = { products: structuredClone(productsFixture), settings: structuredClone(settingsFixture), workerActions: [] };
            await page.addInitScript(() => {
              // Syntactically valid test-only token. All GitHub requests are intercepted below.
              localStorage.setItem("ssv_github_token_v1", "ghp_" + "e2eTestToken012345678901234567890123456789");
            });
            await page.route(workerPattern, async route => {
              if (route.request().method() === "OPTIONS") {
                await route.fulfill({ status: 204, headers: { "Access-Control-Allow-Origin": "*", "Access-Control-Allow-Methods": "POST, OPTIONS", "Access-Control-Allow-Headers": "Content-Type" }, body: "" });
                return;
              }
              const body = route.request().postDataJSON() || {};
              state.workerActions.push(body.action);
              if (body.action === "submitOrder") {
                await route.fulfill({ status: 200, headers: { "Access-Control-Allow-Origin": "*" }, contentType: "application/json", body: JSON.stringify({ success: true, accepted: true, reference: "E2E-TEST-ORDER" }) });
              } else if (body.action === "send" || body.action === "verify") {
                // OTP UI and verification code path only. Never send a real email or OTP.
                await route.fulfill({ status: 200, headers: { "Access-Control-Allow-Origin": "*" }, contentType: "application/json", body: JSON.stringify({ success: true, message: "Mock OTP accepted" }) });
              } else {
                await route.fulfill({ status: 200, headers: { "Access-Control-Allow-Origin": "*" }, contentType: "application/json", body: JSON.stringify({ success: true, products: state.products }) });
              }
            });
            await page.route(githubPattern, async route => {
              const request = route.request();
              if (request.method() === "OPTIONS") {
                await route.fulfill({ status: 204, headers: { "Access-Control-Allow-Origin": "*", "Access-Control-Allow-Methods": "GET, PUT, OPTIONS", "Access-Control-Allow-Headers": "Authorization, Content-Type, Accept, X-GitHub-Api-Version" }, body: "" });
                return;
              }
              const url = new URL(request.url());
              const isProducts = url.pathname.endsWith("/data/products.json");
              if (request.method() === "GET") {
                const value = isProducts ? state.products : state.settings;
                await route.fulfill({
                  status: 200,
                  headers: { "Access-Control-Allow-Origin": "*" },
                  contentType: "application/vnd.github+json",
                  body: JSON.stringify({ sha: isProducts ? "products-test-sha" : "settings-test-sha", content: Buffer.from(JSON.stringify(value)).toString("base64") })
                });
                return;
              }
              if (request.method() === "PUT") {
                const payload = request.postDataJSON();
                const saved = JSON.parse(Buffer.from(payload.content, "base64").toString("utf8"));
                if (isProducts) state.products = saved;
                else state.settings = saved;
                await route.fulfill({
                  status: 200,
                  contentType: "application/vnd.github+json",
                  body: JSON.stringify({ content: { sha: "updated-test-sha" }, commit: { sha: "updated-test-commit" } })
                });
                return;
              }
              await route.continue();
            });
            return state;
          }

          async function runJourney(label, viewport, mobile) {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport, isMobile: mobile, hasTouch: mobile });
            const page = await context.newPage();
            const state = await installMocks(page);
            try {
              await page.goto("http://127.0.0.1:4173/");
              await page.locator("#products [data-product-id]").first().waitFor();
              await page.locator("#ssv-finder-hint").waitFor({ state: "visible" });
              assert.ok(await page.locator("#ssv-smart-finder-trigger").isVisible(), label + ": Finder trigger remains visible with first-load hint");
              assert.equal(await page.locator("#products [data-product-id]").count(), 3, label + ": initial Sarees category");

              await page.locator('[data-tab="Dresses"]').click();
              assert.equal(await page.locator("#products [data-product-id]").count(), 2, label + ": Dresses category filter");
              await page.locator('[data-tab="Jewellery"]').click();
              assert.equal(await page.locator("#products [data-product-id]").count(), 1, label + ": Jewellery category filter");

              await page.locator("#ssv-smart-finder-trigger").click();
              const finderPanelBox = await page.locator("#ssv-smart-finder-panel").boundingBox();
              if (mobile) assert.ok(finderPanelBox && finderPanelBox.width <= viewport.width, label + ": visible finder panel must fit mobile viewport");
              await page.locator("#ssv-finder-category").selectOption("Dresses");
              await page.locator("#ssv-finder-budget").fill("0");
              await page.locator("#ssv-finder-form button[type='submit']").click();
              await page.locator('[data-recovery="all"]').waitFor();
              await page.locator('[data-recovery="all"]').click();
              await page.locator("#ssv-smart-finder-panel").waitFor({ state: "hidden" });
              assert.equal(await page.locator("#products [data-product-id]").count(), 6, label + ": Browse All must show the full enabled catalogue");

              await page.locator("#ssv-smart-finder-trigger").click();
              await page.locator("#ssv-finder-category").selectOption("Dresses");
              await page.locator("#ssv-finder-budget").fill("500");
              await page.locator("#ssv-finder-form button[type='submit']").click();
              assert.equal(await page.locator(".ssv-finder-result").count(), 1, label + ": budget ceiling filters results");
              assert.equal((await page.locator(".ssv-finder-result h3").innerText()).trim(), "Blue frock", label + ": budget result");
              await page.locator("#ssv-finder-budget").fill("800");
              await page.locator("#ssv-finder-color").selectOption("Pink");
              await page.locator("#ssv-finder-form button[type='submit']").click();
              assert.equal((await page.locator(".ssv-finder-result h3").innerText()).trim(), "Printed frock", label + ": recorded colour filter");
              await page.locator("#ssv-finder-category").selectOption("Jewellery");
              assert.equal(await page.locator("#ssv-finder-color-field").isVisible(), false, label + ": Jewellery must hide colour");
              await page.locator("#ssv-finder-budget").fill("");
              await page.locator("#ssv-finder-form button[type='submit']").click();
              const add = page.locator(".ssv-finder-result .ssv-finder-add");
              for (let i = 0; i < 11; i++) await add.click();
              assert.match(await page.locator("#ssv-finder-message").innerText(), /up to 10/i, label + ": 10-item limit message");
              await page.locator(".ssv-finder-close").click();
              await page.locator("#ssv-smart-finder-panel").waitFor({ state: "hidden" });

              await page.locator("#ssv-cart-trigger").click();
              assert.equal((await page.locator(".ssv-cart-item .ssv-qty-value").innerText()).trim(), "10", label + ": bag quantity capped at 10");
              await page.locator("#ssv-proceed-checkout").click();
              await page.locator("#ssv-full-name").fill("E2E Test Customer");
              await page.locator("#ssv-mobile").fill("9876543210");
              await page.locator("#ssv-house").fill("12 Test Street");
              await page.locator("#ssv-landmark").fill("Near test park");
              await page.locator("#ssv-city").fill("Kamareddy");
              await page.locator("#ssv-district").fill("Kamareddy");
              await page.locator("#ssv-state").fill("Telangana");
              await page.locator("#ssv-pin").fill("503111");
              await page.getByRole("button", { name: "Submit Order" }).click();
              await page.locator(".ssv-order-success").waitFor();
              assert.equal((await page.locator(".ssv-order-ref").innerText()).trim(), "E2E-TEST-ORDER", label + ": checkout success state");
              assert.ok(state.workerActions.includes("submitOrder"), label + ": checkout worker contract called");
              await page.locator(".ssv-order-continue").click();

              if (await page.locator("#menu").isVisible()) { await page.locator("#menu").click(); await page.locator("#nav.open").waitFor(); }
              await page.locator("#adminOpen").click();
              await page.locator("#adminEmail").fill("vinith.paithari@gmail.com");
              await page.locator("#sendOtpBtn").click();
              await page.locator("#adminOtp").waitFor({ state: "visible" });
              await page.locator("#adminOtp").fill("123456");
              await page.locator("#verifyOtpBtn").click();
              await page.locator("#adminProductResults").waitFor();
              assert.ok(state.workerActions.includes("send") && state.workerActions.includes("verify"), label + ": OTP request and verification UI path");

              // Enrich Finder is a closable Products-page popup; closing/reopening preserves the catalogue view.
              assert.equal(await page.locator('[data-view="enrich"]').count(), 0, label + ": no separate Enrich Finder tab");
              const enrichLink = page.locator("#adminEnrichFinderLink");
              assert.ok(await enrichLink.isVisible(), label + ": Products page exposes Enrich Finder text link");
              await page.locator("#adminProductSearch").fill("saree");
              const catalogueCountBeforePopup = await page.locator("#adminProductResults").innerText();
              await enrichLink.click();
              await page.getByRole("dialog", { name: "Enrich Finder" }).waitFor({ state: "visible" });
              assert.ok(await page.locator("#adminEnrichFinderClose").isVisible(), label + ": popup has a visible close control");
              assert.ok((await page.locator("#adminEnrichOccasionCount").innerText()).includes("/"), label + ": occasion field count is displayed");
              assert.ok((await page.locator("#adminEnrichColourCount").innerText()).includes("/"), label + ": colour field count is displayed");
              await page.locator("#adminEnrichFinderClose").click();
              await page.getByRole("dialog", { name: "Enrich Finder" }).waitFor({ state: "hidden" });
              assert.equal(await page.locator("#adminProductSearch").inputValue(), "saree", label + ": close preserves catalogue search");
              assert.equal(await page.locator("#adminProductResults").innerText(), catalogueCountBeforePopup, label + ": close preserves catalogue results");
              await page.locator("#adminEnrichFinderLink").click();
              await page.getByRole("dialog", { name: "Enrich Finder" }).waitFor({ state: "visible" });
              await page.locator("#adminEnrichFinderClose").click();

              await page.locator("#adminAddProduct").click();
              await page.locator("#fName").fill("E2E Jewellery Regression Item");
              await page.locator("#fCat").selectOption("Jewellery");
              await page.locator("#fPrice").fill("1250");
              await page.locator("#fImage").fill(productsFixture[0].image);
              await page.locator("#saveItem").click();
              const deadline = Date.now() + 15000;
              while (Date.now() < deadline && !state.products.some(p => p.name === "E2E Jewellery Regression Item" && p.category === "Jewellery" && Number(p.price) === 1250)) {
                await page.waitForTimeout(100);
              }
              assert.ok(state.products.some(p => p.name === "E2E Jewellery Regression Item" && p.category === "Jewellery" && Number(p.price) === 1250), label + ": Admin Jewellery create and GitHub-persistence verification path");

              await page.reload();
              if (await page.locator("#menu").isVisible()) { await page.locator("#menu").click(); await page.locator("#nav.open").waitFor(); }
              await page.locator("#adminOpen").click();
              await page.locator("#adminEmail").fill("vinith.paithari@gmail.com");
              await page.locator("#sendOtpBtn").click();
              await page.locator("#adminOtp").waitFor({ state: "visible" });
              await page.locator("#adminOtp").fill("123456");
              await page.locator("#verifyOtpBtn").click();
              await page.locator("#adminProductSearch").waitFor();
              await page.locator("#adminProductSearch").fill("E2E Jewellery Regression Item");
              await page.locator("#adminProductsScroll").getByText("E2E Jewellery Regression Item").waitFor();
              await page.locator("#adminProductsScroll .edit").first().click();
              await page.locator("#fPrice").fill("1350");
              await page.locator("#saveItem").click();
              const editDeadline = Date.now() + 15000;
              while (Date.now() < editDeadline && !state.products.some(p => p.name === "E2E Jewellery Regression Item" && p.category === "Jewellery" && Number(p.price) === 1350)) {
                await page.waitForTimeout(100);
              }
              assert.ok(state.products.some(p => p.name === "E2E Jewellery Regression Item" && p.category === "Jewellery" && Number(p.price) === 1350), label + ": Admin edit and verified save");

              await page.reload();
              if (await page.locator("#menu").isVisible()) { await page.locator("#menu").click(); await page.locator("#nav.open").waitFor(); }
              await page.locator("#adminOpen").click();
              await page.locator("#adminEmail").fill("vinith.paithari@gmail.com");
              await page.locator("#sendOtpBtn").click();
              await page.locator("#adminOtp").waitFor({ state: "visible" });
              await page.locator("#adminOtp").fill("123456");
              await page.locator("#verifyOtpBtn").click();
              await page.locator("#adminProductSearch").waitFor();
              await page.locator("#adminProductSearch").fill("E2E Jewellery Regression Item");
              await page.locator("#adminProductsScroll").getByText("E2E Jewellery Regression Item").waitFor();
              assert.ok(state.products.some(p => p.name === "E2E Jewellery Regression Item" && Number(p.price) === 1350), label + ": edited Admin data survives reload");
              console.log("PASS " + label + ": catalogue filters, finder recovery, budget/colour, bag limit, checkout, mocked OTP, Admin create/edit/save/reload.");
            } finally {
              await context.close();
              await browser.close();
            }
          }

          await runJourney("desktop", { width: 1440, height: 1000 }, false);
          await runJourney("mobile", { width: 393, height: 852 }, true);
          NODE
          node .smart-finder-browser-regression.mjs
